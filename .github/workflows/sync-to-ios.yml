name: Sync Web Release to iOS Repo

on:
  push:
    branches:
      - main
    paths:
      - 'Releases/**'

# Запобігає конфліктам, якщо робиться кілька пушів поспіль
concurrency:
  group: sync-to-ios
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Sync Releases folder to iOS repository
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTO_SYNC_TOKEN }}
        run: |
          git config --global user.name "GitHub Sync Bot"
          git config --global user.email "bot@github.com"

          # Клонуємо тільки останній коміт гілки main
          git clone --depth 1 --branch main \
            https://x-access-token:${API_TOKEN_GITHUB}@github.com/myk-boy/holy-vibe-capacitor-ios.git ios-repo

          # Створюємо папку www (якщо відсутня) та повністю її очищаємо
          mkdir -p ios-repo/www
          find ios-repo/www -mindepth 1 -delete

          # Копіюємо вміст Releases (включно з прихованими файлами)
          cp -R Releases/. ios-repo/www/

          # Коммітимо та пушимо зміни
          cd ios-repo
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync release update from ${{ github.repository }}@${{ github.sha }}"
            git push origin main
          else
            echo "No changes to sync."
          fi
